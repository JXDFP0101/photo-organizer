<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相册整理 · Photo Organizer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='44' rx='12' fill='%230071e3'/%3E%3Ccircle cx='24' cy='26' r='7' fill='white'/%3E%3Cpath d='M10 46l14-14 10 10 8-8 12 12v-2a10 10 0 0 1-10 10H20a10 10 0 0 1-10-10z' fill='white' opacity='.85'/%3E%3C/svg%3E">
<style>
/* ===================== 设计变量 ===================== */
:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --surface-2:#fbfbfd;
  --text:#1d1d1f;
  --text-2:#6e6e73;
  --text-3:#86868b;
  --accent:#0071e3;
  --accent-hover:#0077ed;
  --accent-soft:rgba(0,113,227,.1);
  --danger:#ff3b30;
  --danger-soft:rgba(255,59,48,.1);
  --border:rgba(0,0,0,.08);
  --border-strong:rgba(0,0,0,.14);
  --radius:14px;
  --radius-sm:10px;
  --radius-lg:20px;
  --sidebar-w:272px;
  --shadow:0 8px 28px rgba(0,0,0,.10);
  --shadow-sm:0 2px 10px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  font-size:14px;
  line-height:1.45;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input{font-family:inherit;font-size:inherit}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.32);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ===================== 布局 ===================== */
#app{display:flex;height:100vh;width:100vw}

/* ===================== 侧边栏 ===================== */
#sidebar{
  width:var(--sidebar-w);flex-shrink:0;height:100%;
  display:flex;flex-direction:column;
  background:rgba(250,250,252,.78);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  backdrop-filter:saturate(180%) blur(24px);
  border-right:1px solid var(--border);
  padding:18px 12px 12px;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:30;
}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px}
.side-brand .logo{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,#0a84ff,#0071e3 55%,#5e5ce6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,113,227,.35);
}
.side-brand .logo svg{width:18px;height:18px}
.side-brand b{font-size:15px;font-weight:600;letter-spacing:.2px}
.side-brand small{display:block;font-size:11px;color:var(--text-3);font-weight:400;margin-top:1px}
#sideClose{display:none;margin-left:auto;width:32px;height:32px;border-radius:9px;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;transition:.15s}
#sideClose:hover{background:rgba(0,0,0,.06);color:var(--text)}
#sideClose svg{width:16px;height:16px}

.side-sec{margin-top:6px}
.side-sec-h{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px}
.side-sec-h span{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.4px}
.side-sec-h button{color:var(--text-3);border-radius:8px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:.15s}
.side-sec-h button:hover{background:rgba(0,0,0,.06);color:var(--text)}
.side-sec-h button svg{width:15px;height:15px}

.side-item{
  display:flex;align-items:center;gap:11px;
  padding:8px 10px;border-radius:var(--radius-sm);
  cursor:pointer;color:var(--text);position:relative;
  transition:background .15s,color .15s;
  user-select:none;
}
.side-item:hover{background:rgba(0,0,0,.05)}
.side-item.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.side-item .ic{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.side-item .ic svg{width:18px;height:18px}
.side-item .cnt{margin-left:auto;font-size:12px;color:var(--text-3)}
.side-item.active .cnt{color:var(--accent)}
.side-item .dot{width:8px;height:8px;border-radius:50%;margin-left:auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.color-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.custom-h{margin:8px 10px 2px;font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.3px}
.side-item .acts{display:none;margin-left:6px;gap:2px}
.side-item:hover .acts{display:flex}
.side-item .acts button{
  width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:var(--text-3);transition:.15s;
}
.side-item .acts button:hover{background:rgba(0,0,0,.08);color:var(--text)}
.side-item .acts button.danger:hover{color:var(--danger);background:var(--danger-soft)}
.side-item .acts svg{width:13px;height:13px}

#folderList{overflow-y:auto;flex:1;margin:2px -2px 0;padding:0 2px}
#folderList.empty-hint{color:var(--text-3);font-size:12px;padding:6px 10px;line-height:1.6}

.side-foot{padding:10px 10px 2px;border-top:1px solid var(--border);margin-top:10px}
.side-foot .st-tip{font-size:11px;color:var(--text-3);line-height:1.6}
.side-foot .st-tip b{color:var(--text-2);font-weight:500}

/* 拖入文件夹高亮 */
.folder-drag{background:var(--accent-soft)!important;color:var(--accent)!important}
.folder-drag .cnt{color:var(--accent)}

/* ===================== 主区域 ===================== */
#main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;position:relative}

#topbar{
  display:flex;align-items:center;gap:12px;
  padding:14px 22px;
  background:rgba(245,245,247,.82);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
  z-index:20;
}
#hamburger{display:none;width:34px;height:34px;border-radius:9px;align-items:center;justify-content:center;color:var(--text-2)}
#hamburger:hover{background:rgba(0,0,0,.05)}
#hamburger svg{width:19px;height:19px}

#viewTitle{font-size:18px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewSub{font-size:12px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.top-spacer{flex:1}

.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:11px;width:15px;height:15px;color:var(--text-3);pointer-events:none}
#searchInput{
  width:190px;height:34px;border-radius:10px;border:1px solid transparent;
  background:rgba(0,0,0,.06);outline:none;padding:0 12px 0 34px;font-size:13px;
  color:var(--text);transition:.2s;
}
#searchInput:focus{background:var(--surface);border-color:var(--border-strong);box-shadow:0 0 0 3px rgba(0,113,227,.12);width:230px}
#searchInput::placeholder{color:var(--text-3)}
#searchClear{position:absolute;right:6px;width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--text-3)}
#searchClear:hover{background:rgba(0,0,0,.08)}
#searchClear svg{width:12px;height:12px}

.tb-btn{
  display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:10px;
  font-size:13px;font-weight:500;transition:.18s;white-space:nowrap;
}
.tb-btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,113,227,.3)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:rgba(0,0,0,.055);color:var(--text)}
.btn-ghost:hover{background:rgba(0,0,0,.09)}
.btn-ghost.on{background:var(--accent-soft);color:var(--accent)}
.tb-btn:active{transform:scale(.97)}

/* ===================== 内容 ===================== */
#content{flex:1;overflow-y:auto;padding:22px 26px 60px;scroll-behavior:smooth}

#groupBar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
#groupBar .gb-back{
  display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--accent);
  padding:6px 12px;border-radius:9px;background:var(--accent-soft);font-weight:500;transition:.15s;
}
#groupBar .gb-back:hover{background:rgba(0,113,227,.16)}
#groupBar .gb-back svg{width:14px;height:14px}
#groupBar .gb-name{font-size:15px;font-weight:600;margin-left:4px}

.smart-h{display:flex;align-items:center;gap:9px;margin:0 0 14px;padding:0 2px}
.smart-block{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow-sm);padding:18px 18px 8px;margin-bottom:22px;
}
.smart-h:first-child{margin-top:0}
.smart-h .sh-dot{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.smart-h .sh-name{font-size:15px;font-weight:600}
.smart-h .sh-cnt{font-size:12px;color:var(--text-3)}
.smart-h .sh-open{margin-left:auto;font-size:12px;color:var(--accent);font-weight:500;padding:4px 10px;border-radius:8px;transition:.15s}
.smart-h .sh-open:hover{background:var(--accent-soft)}

/* 网格 */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.grid-sec{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:14px}
#grid.compact{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.photo-card{
  position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:1;
  background:var(--surface);box-shadow:var(--shadow-sm);cursor:pointer;
  transition:transform .2s cubic-bezier(.3,0,.2,1),box-shadow .2s;
  user-select:none;
}
.photo-card:hover{transform:scale(1.02);box-shadow:var(--shadow)}
.photo-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.photo-card .pc-check{
  position:absolute;top:9px;left:9px;width:24px;height:24px;border-radius:50%;
  background:rgba(20,20,24,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.7);transition:.16s;cursor:pointer;z-index:2;
}
.photo-card:hover .pc-check{opacity:1;transform:scale(1)}
.photo-card .pc-check svg{width:13px;height:13px;color:#fff;opacity:0}
.photo-card.selected{box-shadow:0 0 0 3px var(--accent),0 8px 24px rgba(0,113,227,.28)}
.photo-card.selected .pc-check{opacity:1;transform:scale(1);background:var(--accent);border-color:var(--accent)}
.photo-card.selected .pc-check svg{opacity:1}
.photo-card.dragging{opacity:.45;transform:scale(.96)}
.photo-card .pc-badge{
  position:absolute;bottom:8px;right:8px;font-size:10px;font-weight:500;color:#fff;
  background:rgba(20,20,24,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:2px 7px;border-radius:20px;opacity:0;transition:.16s;
}
.photo-card:hover .pc-badge{opacity:1}
#app.sel-mode .photo-card .pc-check{opacity:1;transform:scale(1)}

/* 空状态 */
#emptyState{
  display:none;text-align:center;padding:80px 20px;max-width:460px;margin:0 auto;
}
#emptyState.show{display:block}
#emptyState .es-ic{
  width:76px;height:76px;border-radius:22px;margin:0 auto 22px;
  background:linear-gradient(135deg,#e8f1ff,#eef3ff);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(0,113,227,.12);
}
#emptyState .es-ic svg{width:34px;height:34px;color:var(--accent)}
#emptyState h2{font-size:19px;font-weight:600;margin-bottom:8px}
#emptyState p{font-size:13.5px;color:var(--text-2);line-height:1.7}
#emptyState .es-btn{margin-top:22px;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;height:38px;padding:0 20px;border-radius:12px;font-weight:500;font-size:13.5px;box-shadow:0 3px 12px rgba(0,113,227,.3);transition:.18s}
#emptyState .es-btn:hover{background:var(--accent-hover)}
#emptyState .es-btn svg{width:16px;height:16px}

/* ===================== 选择工具栏 ===================== */
#selBar{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);
  display:flex;align-items:center;gap:4px;padding:7px;border-radius:16px;
  background:rgba(30,30,34,.82);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  box-shadow:0 12px 40px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.22s cubic-bezier(.3,0,.2,1);z-index:40;
}
#selBar.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#selBar .sel-count{color:#fff;font-size:13px;font-weight:500;padding:0 12px;white-space:nowrap}
#selBar .sep{width:1px;height:22px;background:rgba(255,255,255,.18);margin:0 4px}
#selBar button{
  display:flex;align-items:center;gap:6px;color:#fff;font-size:13px;font-weight:500;
  padding:8px 13px;border-radius:10px;transition:.15s;white-space:nowrap;
}
#selBar button:hover{background:rgba(255,255,255,.14)}
#selBar button.danger:hover{background:rgba(255,59,48,.85)}
#selBar button svg{width:15px;height:15px}

/* ===================== 上传进度 ===================== */
#uploadBar{
  position:fixed;top:0;left:0;right:0;height:3px;z-index:60;display:none;
  background:rgba(0,113,227,.12);overflow:hidden;
}
#uploadBar.show{display:block}
#uploadBar .ub-fill{height:100%;background:var(--accent);width:0;transition:width .2s}

/* ===================== 灯箱 ===================== */
#lightbox{
  position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  background:rgba(12,12,14,.92);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);
}
#lightbox.show{display:flex}
#lightbox .lb-stage{display:flex;flex-direction:column;align-items:center;max-width:88vw;max-height:92vh}
#lightbox img{max-width:86vw;max-height:74vh;border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.5);object-fit:contain;background:#111}
#lbInfo{display:flex;align-items:center;gap:10px;margin-top:16px;color:#e8e8ed;font-size:13px;max-width:86vw}
#lbInfo .lb-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:42vw}
#lbInfo .lb-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lb-tag{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.12);color:#cfd0d6;display:flex;align-items:center;gap:5px;white-space:nowrap}
.lb-tag .t-dot{width:7px;height:7px;border-radius:50%}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.lb-nav:hover{background:rgba(255,255,255,.2)}
.lb-nav svg{width:20px;height:20px}
#lbPrev{left:26px}#lbNext{right:26px}
#lbClose{position:absolute;top:22px;right:24px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;transition:.15s}
#lbClose:hover{background:rgba(255,255,255,.2)}
#lbClose svg{width:18px;height:18px}
#lbTools{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
#lbTools button{
  display:flex;align-items:center;gap:7px;color:#fff;font-size:13px;font-weight:500;
  background:rgba(255,255,255,.12);padding:9px 16px;border-radius:11px;transition:.15s;
}
#lbTools button:hover{background:rgba(255,255,255,.22)}
#lbTools button svg{width:15px;height:15px}

/* ===================== 弹窗 ===================== */
#modalRoot{
  position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:rgba(20,20,24,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
#modalRoot.show{display:flex}
.modal{
  width:440px;max-width:92vw;max-height:86vh;overflow:auto;
  background:var(--surface);border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.25);
  padding:26px 28px;animation:pop .25s cubic-bezier(.3,1.2,.4,1);
}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.modal h3{font-size:18px;font-weight:600;margin-bottom:6px}
.modal .m-desc{font-size:13px;color:var(--text-2);line-height:1.65;margin-bottom:18px}
.modal input[type=text]{
  width:100%;height:42px;border-radius:12px;border:1px solid var(--border-strong);
  padding:0 14px;font-size:14px;outline:none;background:var(--surface-2);transition:.18s;margin-bottom:16px;
}
.modal input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.13);background:#fff}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.m-actions button{height:38px;padding:0 18px;border-radius:11px;font-size:13.5px;font-weight:500;transition:.15s}
.m-actions .m-cancel{background:rgba(0,0,0,.06);color:var(--text)}
.m-actions .m-cancel:hover{background:rgba(0,0,0,.1)}
.m-actions .m-ok{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,113,227,.28)}
.m-actions .m-ok:hover{background:var(--accent-hover)}
.m-actions .m-danger{background:var(--danger);color:#fff;box-shadow:0 2px 8px rgba(255,59,48,.28)}
.m-actions .m-danger:hover{background:#e0362d}
.m-actions button:disabled{opacity:.5;cursor:default}

/* 分段选择 */
.seg{display:flex;background:rgba(0,0,0,.055);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{
  flex:1;height:38px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text-2);
  display:flex;align-items:center;justify-content:center;gap:7px;transition:.18s;
}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 5px rgba(0,0,0,.1),0 0 0 1px var(--border)}
.seg-desc{font-size:12.5px;color:var(--text-3);margin:-8px 0 16px;line-height:1.6}

/* 进度 */
.prog{margin:6px 0 16px}
.prog .p-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);margin-bottom:7px}
.prog .p-bar{height:7px;border-radius:6px;background:rgba(0,0,0,.07);overflow:hidden}
.prog .p-fill{height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .15s}

/* 整理预览 */
.folder-preview{list-style:none;margin:4px 0 16px;max-height:250px;overflow-y:auto;border:1px solid var(--border);border-radius:14px;padding:6px}
.folder-preview li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:.12s}
.folder-preview li:hover{background:rgba(0,0,0,.045)}
.folder-preview li.off{opacity:.45}
.folder-preview .fp-dot{width:14px;height:14px;border-radius:5px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.folder-preview .fp-name{font-size:13.5px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-preview .fp-cnt{font-size:12px;color:var(--text-3)}
.folder-preview .fp-check{color:var(--accent);display:flex}
.folder-preview .fp-check svg{width:16px;height:16px}
.folder-preview .fp-check.off{color:var(--text-3);opacity:.4}

/* 移动选择列表 */
.move-list{list-style:none;margin:4px 0 16px;max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:14px;padding:6px}
.move-list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;transition:.12s}
.move-list li:hover{background:var(--accent-soft);color:var(--accent)}
.move-list li svg{width:16px;height:16px;color:var(--text-3)}
.move-list li:hover svg{color:var(--accent)}

/* ===================== Toast ===================== */
#toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);z-index:90;
  background:rgba(30,30,34,.9);color:#fff;font-size:13px;font-weight:500;
  padding:11px 20px;border-radius:14px;box-shadow:0 10px 36px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:.25s cubic-bezier(.3,0,.2,1);
  display:flex;align-items:center;gap:9px;max-width:80vw;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast svg{width:16px;height:16px;flex-shrink:0}
#toast.err svg{color:#ff6961}
#toast.ok svg{color:#30d158}

/* ===================== 拖拽上传遮罩 ===================== */
#dropOverlay{
  position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:rgba(245,245,247,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
#dropOverlay.show{display:flex}
#dropOverlay .do-box{
  width:min(480px,86vw);padding:52px 30px;text-align:center;border-radius:28px;
  border:2px dashed rgba(0,113,227,.5);background:rgba(255,255,255,.85);
  box-shadow:0 20px 70px rgba(0,0,0,.12);
}
#dropOverlay .do-box svg{width:44px;height:44px;color:var(--accent);margin-bottom:16px}
#dropOverlay .do-box b{font-size:17px;font-weight:600;display:block;margin-bottom:6px}
#dropOverlay .do-box p{font-size:13px;color:var(--text-2)}

/* ===================== 响应式 ===================== */
@media (max-width:900px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--shadow)}
  #sidebar.open{transform:translateX(0)}
  #hamburger{display:flex}
  #sideClose{display:flex}
  #main{width:100%}
  #content{padding:16px 14px 80px}
  #grid,.grid-sec{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
  .search-wrap{display:none}
  .tb-btn span.lbl{display:none}
  .tb-btn{padding:0 12px}
}
@media (max-width:520px){
  #grid,.grid-sec{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px}
  #topbar{padding:12px 14px}
  #viewTitle{font-size:16px}
  .modal{padding:22px 20px}
  #searchInput{font-size:16px}
}
@media (hover:none){
  .photo-card .pc-check{opacity:1;transform:scale(1)}
  .side-item .acts{display:flex}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

<script>
'use strict';
/* =====================================================================
   工具函数
===================================================================== */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, type){
  const t = $('#toast');
  const ok = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  const er = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  t.innerHTML = (type === 'err' ? er : ok) + '<span>' + esc(msg) + '</span>';
  t.className = type === 'err' ? 'show err' : 'show ok';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.className = '', 2600);
}

function fmtCount(n){
  return n >= 10000 ? (n/10000).toFixed(1) + ' 万' : String(n);
}
function fmtBytes(b){
  if (b >= 1048576) return (b/1048576).toFixed(1) + ' MB';
  if (b >= 1024) return Math.round(b/1024) + ' KB';
  return b + ' B';
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';
}

/* =====================================================================
   IndexedDB 封装
===================================================================== */
const DB_NAME = 'photo_organizer', DB_VER = 1;
const S_META = 'meta', S_BLOBS = 'blobs', S_FOLDERS = 'folders';

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(S_META)) db.createObjectStore(S_META, {keyPath:'id'});
      if (!db.objectStoreNames.contains(S_FOLDERS)) db.createObjectStore(S_FOLDERS, {keyPath:'id'});
      if (!db.objectStoreNames.contains(S_BLOBS)){
        const st = db.createObjectStore(S_BLOBS, {keyPath:'id'});
        st.createIndex('kind','kind',{unique:false});
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbReq(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function dbAll(store){ return idbReq(_db.transaction(store,'readonly').objectStore(store).getAll()); }
function dbGet(store, key){ return idbReq(_db.transaction(store,'readonly').objectStore(store).get(key)); }
function dbPut(store, val){ return idbReq(_db.transaction(store,'readwrite').objectStore(store).put(val)); }
function dbDel(store, key){ return idbReq(_db.transaction(store,'readwrite').objectStore(store).delete(key)); }
function dbAllKind(kind){
  return new Promise((res, rej) => {
    const r = _db.transaction(S_BLOBS,'readonly').objectStore(S_BLOBS).index('kind').getAll(kind);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}

/* =====================================================================
   全局状态
===================================================================== */
const state = {
  meta: [],            // 照片元数据
  folders: [],         // 文件夹
  thumbs: new Map(),   // photoId -> objectURL（缩略图）
  view: { type:'all', folderId:null, smart:null, group:null, q:'' },
  selected: new Set(),
  selMode: false,      // 多选模式
  lb: null,            // 灯箱当前 photoId
  geocodeCache: new Map(),
  uploadAbort: false,
};
let _db = null;

/* =====================================================================
   颜色分析（完全离线，画布取主色）
===================================================================== */
function rgbToHsl(r, g, b){
  r/=255; g/=255; b/=255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h = 0, s = 0;
  const l = (max+min)/2;
  if (max !== min){
    const d = max-min;
    s = l > .5 ? d/(2-max-min) : d/(max+min);
    if (max===r) h = ((g-b)/d + (g<b?6:0));
    else if (max===g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60;
  }
  return [h, s, l];
}

function colorNameFromHsl(h, s, l){
  if (s < 0.12) return '黑白灰'; // 低饱和统一归黑白灰
  const warm = (h >= 330 && h <= 360) || h <= 55;
  if (l >= 0.82 && (h <= 15 || h >= 315)) return '粉';
  if (l <= 0.14) return '黑';
  if (l >= 0.92) return '白';
  if (s < 0.32 && warm && l >= 0.18 && l <= 0.62) return '棕';
  if (h <= 12 || h >= 345) return '红';
  if (h <= 38) return '橙';
  if (h <= 68) return '黄';
  if (h <= 160) return '绿';
  if (h <= 198) return '青';
  if (h <= 252) return '蓝';
  if (h <= 290) return '紫';
  if (h <= 330) return '粉';
  return '红';
}

const COLOR_ORDER = ['红','橙','黄','绿','青','蓝','紫','粉','棕','黑白灰']; // 10 色系
const COLOR_FOLDERS = COLOR_ORDER; // 整理时 10 色全部建文件夹
const COLOR_HEX = {
  '红':'#ff453a','橙':'#ff9f0a','黄':'#ffd60a','绿':'#30d158','青':'#64d2ff',
  '蓝':'#0a84ff','紫':'#bf5af2','粉':'#ff9bd2','棕':'#a2845e','黑白灰':'#8e8e93'
};

async function analyzeColor(img){
  const size = 56;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d', { willReadFrequently:true });
  const iw = img.naturalWidth || 1, ih = img.naturalHeight || 1;
  const sc = Math.max(size/iw, size/ih);
  ctx.drawImage(img, 0, 0, Math.max(1, Math.round(iw*sc)), Math.max(1, Math.round(ih*sc)));
  const data = ctx.getImageData(0, 0, size, size).data;
  // 用 4bit/通道 量化成桶，统计权重；同时统计彩色像素占比
  const buckets = new Map();
  let colorful = 0, total = 0;
  for (let i = 0; i < data.length; i += 4){
    const r = data[i], g = data[i+1], b = data[i+2];
    const key = ((r>>4)<<8) | ((g>>4)<<4) | (b>>4);
    let e = buckets.get(key);
    if (!e){ e = {n:0, r:0, g:0, b:0}; buckets.set(key, e); }
    e.n++; e.r += r; e.g += g; e.b += b;
    total++;
    const [,,s] = rgbToHsl(r, g, b);
    if (s >= 0.12) colorful++;
  }
  // 90% 以上像素非主流彩色（几乎无彩色）→ 整张按黑白灰处理
  if (colorful / total < 0.10){
    return { hex: '#8e8e93', name: '黑白灰' };
  }
  // 彩色像素占比足够时，主色只在彩色桶里选，避免黑边/阴影/暗背景主导
  const useColorful = colorful / total >= 0.25;
  let best = null;
  for (const e of buckets.values()){
    if (useColorful){
      const [,,s] = rgbToHsl(Math.round(e.r/e.n), Math.round(e.g/e.n), Math.round(e.b/e.n));
      if (s < 0.12) continue;
    }
    if (!best || e.n > best.n) best = e;
  }
  if (!best) best = Array.from(buckets.values()).sort((a,b) => b.n - a.n)[0];
  const r = Math.round(best.r/best.n), g = Math.round(best.g/best.n), b = Math.round(best.b/best.n);
  const [h, s, l] = rgbToHsl(r, g, b);
  return {
    hex: '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join(''),
    name: colorNameFromHsl(h, s, l)
  };
}

/* =====================================================================
   EXIF GPS 解析（JPEG 专用，纯本地）
===================================================================== */
function readU16(dv, off, le){ return le ? dv.getUint16(off, true) : dv.getUint16(off, false); }
function readU32(dv, off, le){ return le ? dv.getUint32(off, true) : dv.getUint32(off, false); }

function parseTIFF(dv, base, le){
  const ifd0 = readU32(dv, base+4, le);
  if (ifd0 > dv.byteLength - 2) return null;
  let gpsOff = null;
  const n = readU16(dv, base+ifd0, le);
  for (let i = 0; i < n; i++){
    const e = base + ifd0 + 2 + i*12;
    const tag = readU16(dv, e, le);
    const type = readU16(dv, e+2, le);
    const cnt = readU32(dv, e+4, le);
    let valOff = e+8;
    const sz = [0,1,1,2,4,8][type] || 0;
    if (sz * cnt > 4) valOff = base + readU32(dv, e+8, le);
    if (tag === 0x8825 && type === 4 && cnt === 1) gpsOff = readU32(dv, e+8, le);
    if (tag === 0x8769) continue; // Exif IFD 本工具暂不需要
  }
  if (gpsOff === null) return null;
  // 解析 GPS IFD
  const gbase = base + gpsOff;
  if (gbase > dv.byteLength - 2) return null;
  const gn = readU16(dv, gbase, le);
  let latRef = '', lonRef = '', lat = null, lon = null;
  for (let i = 0; i < gn; i++){
    const e = gbase + 2 + i*12;
    const tag = readU16(dv, e, le);
    const type = readU16(dv, e+2, le);
    const cnt = readU32(dv, e+4, le);
    const sz = [0,1,1,2,4,8][type] || 0;
    const valOff = sz*cnt > 4 ? gbase + readU32(dv, e+8, le) : e+8;
    if (tag === 1){ // 纬度参考 N/S
      let s = '';
      for (let k = 0; k < Math.min(cnt, 2); k++) s += String.fromCharCode(dv.getUint8(valOff+k));
      latRef = s.trim();
    } else if (tag === 2 && cnt === 3){ // 纬度
      lat = [0,1,2].map(k => readU32(dv, valOff+k*8, le) / readU32(dv, valOff+k*8+4, le));
    } else if (tag === 3){ // 经度参考 E/W
      let s = '';
      for (let k = 0; k < Math.min(cnt, 2); k++) s += String.fromCharCode(dv.getUint8(valOff+k));
      lonRef = s.trim();
    } else if (tag === 4 && cnt === 3){ // 经度
      lon = [0,1,2].map(k => readU32(dv, valOff+k*8, le) / readU32(dv, valOff+k*8+4, le));
    }
  }
  if (lat === null || lon === null) return null;
  const dms = a => a[0] + a[1]/60 + a[2]/3600;
  return {
    lat: (latRef.toUpperCase() === 'S' ? -1 : 1) * dms(lat),
    lng: (lonRef.toUpperCase() === 'W' ? -1 : 1) * dms(lon)
  };
}

async function extractGPS(file){
  try{
    if (file.type !== 'image/jpeg' && !/\.jpe?g$/i.test(file.name)) return null;
    const buf = await file.arrayBuffer();
    const dv = new DataView(buf);
    if (dv.byteLength < 4 || dv.getUint16(0) !== 0xFFD8) return null;
    let off = 2;
    while (off < dv.byteLength - 4){
      if (dv.getUint8(off) !== 0xFF){ off++; continue; }
      const marker = dv.getUint8(off+1);
      if (marker === 0xD8 || marker === 0xD9) { off += 2; continue; }
      if (marker >= 0xD0 && marker <= 0xD7){ off += 2; continue; }
      if (marker === 0xDA) break; // 图像数据开始，结束扫描
      const len = dv.getUint16(off+2);
      if (len < 2) break;
      if (marker === 0xE1){
        let sig = '';
        for (let k = 0; k < 6; k++) sig += String.fromCharCode(dv.getUint8(off+4+k));
        if (sig === 'Exif\0\0'){
          const le = dv.getUint16(off+10) === 0x4949; // II=小端, MM=大端
          return parseTIFF(dv, off+10, le);
        }
      }
      off += 2 + len;
    }
  }catch(e){ /* 解析失败视为无 GPS */ }
  return null;
}

/* =====================================================================
   逆地理编码（BigDataCloud 免费接口，中文）
===================================================================== */
async function reverseGeocode(lat, lng){
  const key = lat.toFixed(3) + ',' + lng.toFixed(3);
  if (state.geocodeCache.has(key)) return state.geocodeCache.get(key);
  try{
    const url = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' +
      encodeURIComponent(lat) + '&longitude=' + encodeURIComponent(lng) + '&localityLanguage=zh';
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    const resp = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    if (!resp.ok) throw new Error(resp.status);
    const j = await resp.json();
    const parts = [j.city || j.locality, j.principalSubdivision, j.countryName].filter(Boolean);
    const name = parts.join(' · ') || ('坐标 ' + lat.toFixed(2) + '°, ' + lng.toFixed(2) + '°');
    state.geocodeCache.set(key, name);
    return name;
  }catch(e){
    const name = '坐标 ' + lat.toFixed(2) + '°, ' + lng.toFixed(2) + '°';
    state.geocodeCache.set(key, name);
    return name;
  }
}

===================================================================== */
let aiState = 'idle'; // idle | loading | ready | failed

function ensureAI(){
  if (aiState === 'ready' || aiState === 'loading') return aiState === 'ready' ? Promise.resolve(true) : aiState;
  if (aiState === 'failed') return Promise.resolve(false);
  aiState = 'loading';
  return new Promise((resolve) => {
    const load = (src) => new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    (async () => {
      try{
        await load('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
        await load('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
        await tf.ready();
        window.mobilenetModel = await mobilenet.load({ version: 2, alpha: 0.5 });
        aiState = 'ready';
        resolve(true);
      }catch(e){
        aiState = 'failed';
        resolve(false);
      }
    })();
  });
}

function mapSubject(label){
  const lower = String(label).toLowerCase();
  for (const [re, zh] of SUBJECT_MAP){
    if (re.test(lower)) return zh;
  }
  return label;
}

async function classifyImage(imgEl){

  return mapSubject(res && res[0] && res[0].className ? res[0].className : '未知');
}

function smartKey(m){
  if (state.view.smart === 'color') return m.colorName || '未识别';
  if (state.view.smart === 'region') return m.region || '未标注位置';
  return m.subjectZh || '未识别';
}

function viewPhotos(){
  let list = state.meta;
  if (state.view.type === 'folder') list = list.filter(m => m.folderId === state.view.folderId);
  else if (state.view.type === 'color') list = list.filter(m => (m.colorName || '未识别') === state.view.colorKey);
  else if (state.view.type === 'smart' && state.view.group) list = list.filter(m => smartKey(m) === state.view.group);
  const q = state.view.q.trim().toLowerCase();
  if (q){
    list = list.filter(m => [m.name, m.colorName, m.region, m.subjectZh, m.subject]
      .filter(Boolean).some(v => String(v).toLowerCase().includes(q)));
  }
  return list;
}

function smartGroups(){
  const map = new Map();
  for (const m of viewPhotos()){
    const k = smartKey(m);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(m);
  }
  let keys = [...map.keys()];
  if (state.view.smart === 'color'){
    keys.sort((a,b) => { const ia = COLOR_ORDER.indexOf(a), ib = COLOR_ORDER.indexOf(b);
      return (ia<0?99:ia) - (ib<0?99:ib); });
  } else {
    keys.sort((a,b) => map.get(b).length - map.get(a).length);
  }
  return keys.map(k => ({ key:k, items: map.get(k) }));
}

  if (t.type === 'color') return t.colorKey || '颜色文件夹';

}

/* =====================================================================
   上传
===================================================================== */
function loadImage(url){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = url;
  });
}
function canvasBlob(canvas, type, q){
  return new Promise(res => canvas.toBlob(b => res(b), type, q));
}
async function makeThumb(img){
  const edge = 900;
  const scale = Math.min(1, edge / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.naturalWidth * scale));
  c.height = Math.max(1, Math.round(img.naturalHeight * scale));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const thumb = await canvasBlob(c, 'image/jpeg', 0.82);
  return thumb;
}

async function processOne(file){
  const url = URL.createObjectURL(file);
  let img = null;
  try{ img = await loadImage(url); }catch(e){}
  if (!img){ URL.revokeObjectURL(url); throw new Error('decode'); }
  const thumb = await makeThumb(img);
  const color = await analyzeColor(img);
  const gps = await extractGPS(file);
  const id = uid();
  const m = {
    id, name: file.name, addedAt: Date.now(), folderId: null,
    width: img.naturalWidth, height: img.naturalHeight,
    colorHex: color.hex, colorName: color.name,
    gps, region: null, subjectZh: null, subject: null,
    analyzed: { gps: !!gps, region: !!gps, subject: false }
  };
  await dbPut(S_META, m);
  await dbPut(S_BLOBS, { id: id + ':t', kind: 'thumb', photoId: id, blob: thumb });
  await dbPut(S_BLOBS, { id: id + ':f', kind: 'full', photoId: id, blob: file });
  state.meta.push(m);
  state.thumbs.set(id, URL.createObjectURL(thumb));
  URL.revokeObjectURL(url);
}

async function handleFiles(fileList){
  const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/'));
  if (!files.length){ toast('没有可用的图片文件', 'err'); return; }
  const bar = $('#uploadBar');
  bar.classList.add('show');
  const fill = bar.querySelector('.ub-fill');
  fill.style.width = '2%';
  let ok = 0, fail = 0;
  for (let i = 0; i < files.length; i++){
    fill.style.width = Math.round((i / files.length) * 96) + '%';
    try{
      await processOne(files[i]);
      ok++;
    }catch(e){ fail++; }
    await sleep(0);
  }
  fill.style.width = '100%';
  setTimeout(() => bar.classList.remove('show'), 400);
  renderAll();
  toast(ok ? '已上传 ' + ok + ' 张照片' + (fail ? '，' + fail + ' 张无法读取' : '') : '上传失败，请检查文件格式', fail && !ok ? 'err' : 'ok');
}

/* =====================================================================
   智能整理（一键按 颜色/地域/题材 生成文件夹）
===================================================================== */
let abortAnalyze = false;

async function analyzeFor(mode, onProgress){
  const total = Math.max(1, state.meta.length);
  let done = 0;
  const tick = n => { done += n; onProgress && onProgress(Math.min(100, Math.round(done/total*100)), Math.min(done, total), total); };
  if (mode === 'region'){
    const need = state.meta.filter(m => m.gps && !m.region);
    for (const m of need){
      if (abortAnalyze) return { aborted:true };
      m.region = await reverseGeocode(m.gps.lat, m.gps.lng);
      m.analyzed.region = true;
      await dbPut(S_META, m);
      tick(1);
    }
    tick(total - done);
    return { ok:true };
  }
  if (mode === 'subject'){
    const ok = await ensureAI();
    if (!ok) return { error:'AI 模型加载失败，请检查网络连接后重试' };
    const need = state.meta.filter(m => !m.subjectZh);
    for (const m of need){
      if (abortAnalyze) return { aborted:true };
      try{
        const rec = await dbGet(S_BLOBS, m.id + ':t');
        if (rec){
          const url = URL.createObjectURL(rec.blob);
          const img = await loadImage(url);
          if (img){
            m.subjectZh = await classifyImage(img);
            m.analyzed.subject = true;
            await dbPut(S_META, m);
          }
          URL.revokeObjectURL(url);
        }
      }catch(e){}
      tick(1);
    }
    tick(total - done);
    return { ok:true };
  }
  // color：重新分析（读取缩略图重算主色，修复旧数据与算法更新）
  for (const m of state.meta){
    if (abortAnalyze) return { aborted:true };
    try{
      const rec = await dbGet(S_BLOBS, m.id + ':t');
      if (rec){
        const url = URL.createObjectURL(rec.blob);
        const img = await loadImage(url);
        if (img){
          const col = await analyzeColor(img);
          m.colorHex = col.hex; m.colorName = col.name;
          await dbPut(S_META, m);
        }
        URL.revokeObjectURL(url);
      }
    }catch(e){}
    tick(1);
  }
  tick(total - done);
  return { ok:true };
}

function organizeGroups(mode){
  const map = new Map();
  for (const m of state.meta){
    let k;
    if (mode === 'color'){
      k = m.colorName || '未识别';
      if (!COLOR_FOLDERS.includes(k)) continue; // 未识别不建文件夹
    }
    else if (mode === 'region') k = m.region || '未标注位置';
    else k = m.subjectZh || '未识别';
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(m);
  }
  const order = mode === 'color' ? COLOR_ORDER : null;
  let keys = [...map.keys()];
  if (order) keys.sort((a,b) => { const ia=order.indexOf(a), ib=order.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
  else keys.sort((a,b) => map.get(b).length - map.get(a).length);
  return keys.map(k => ({ key:k, items: map.get(k), off: (k==='未识别'||k==='未标注位置') }));
}

  if (m.region) tags.push('<span class="lb-tag">' + esc(m.region) + '</span>');
  if (m.subjectZh) tags.push('<span class="lb-tag">' + esc(m.subjectZh) + '</span>');
  if (m.width && m.height) tags.push('<span class="lb-tag">' + m.width + ' × ' + m.height + '</span>');
  tags.push('<span class="lb-tag">' + fmtDate(m.addedAt) + '</span>');
  $('#lbTags').innerHTML = tags.join('');
  const list = lbList(), i = list.indexOf(id);
  $('#lbPrev').style.visibility = i > 0 ? 'visible' : 'hidden';
  $('#lbNext').style.visibility = (i >= 0 && i < list.length - 1) ? 'visible' : 'hidden';
}
function lbNav(dir){
  const list = lbList();
  const i = list.indexOf(state.lb);
  const j = i + dir;
  if (j >= 0 && j < list.length) openLightbox(list[j]);
}
function closeLightbox(){
  $('#lightbox').classList.remove('show');
  if (lbUrl) URL.revokeObjectURL(lbUrl);
  lbUrl = null;
  state.lb = null;
}

/* =====================================================================
   事件绑定
===================================================================== */
let dragPhotoId = null;
let dragDepth = 0;

function closeSidebar(){ $('#sidebar').classList.remove('open'); }

function confirmDelete(ids, then){
  const box = $('#modalBox');
  box.innerHTML = '<h3>删除 ' + ids.length + ' 张照片？</h3>' +
    '<p class="m-desc">删除后无法恢复，请确认这些照片不再需要。</p>' +
    '<div class="m-actions"><button class="m-cancel" data-close>取消</button><button class="m-ok m-danger" id="delOk">删除</button></div>';
  openModal();
  $('#delOk').onclick = () => { closeModal(); deletePhotos(ids).then(then || (()=>{})); };
}

function bindEvents(){
  // 侧边栏导航（智能相簿）
  $$('.side-item[data-view]').forEach(el => {
    el.addEventListener('click', () => {
      state.view = { type: el.dataset.view, folderId: null, smart: el.dataset.smart || null, group: null, q: '' };
      $('#searchInput').value = '';
      renderAll();
      closeSidebar();
    });
  });
  // 文件夹列表：色系文件夹 / 自定义文件夹（只读）
  $('#folderList').addEventListener('click', e => {
    const item = e.target.closest('.side-item');
    if (!item) return;
    if (item.dataset.color){
      state.view = { type:'color', colorKey: item.dataset.color, folderId:null, smart:null, group:null, q:'' };
      $('#searchInput').value = '';
      renderAll();
      closeSidebar();
      return;
    }
    if (item.dataset.fid){
      state.view = { type:'folder', folderId: item.dataset.fid, colorKey:null, smart:null, group:null, q:'' };
      $('#searchInput').value = '';
      renderAll();
      closeSidebar();
    }
  });
  // 文件夹拖放目标
  $('#folderList').addEventListener('dragover', e => {
    const item = e.target.closest('.folder-item');
    if (!item || !dragPhotoId) return;
    e.preventDefault();
    item.classList.add('folder-drag');
  });
  $('#folderList').addEventListener('dragleave', e => {
    const item = e.target.closest('.folder-item');
    if (item) item.classList.remove('folder-drag');
  });
  $('#folderList').addEventListener('drop', e => {
    const item = e.target.closest('.side-item');
    e.preventDefault();
    if (item && dragPhotoId){
      item.classList.remove('folder-drag');
      if (item.dataset.color) moveToColor([dragPhotoId], item.dataset.color);
      else if (item.dataset.fid) movePhotos([dragPhotoId], item.dataset.fid);
    }
    dragPhotoId = null;
  });


  // 上传
  const openPicker = () => $('#fileInput').click();
  $('#btnUpload').addEventListener('click', openPicker);
  $('#emptyUpload').addEventListener('click', openPicker);
  $('#fileInput').addEventListener('change', e => {
    handleFiles(e.target.files);
    e.target.value = '';
  });

  // 智能整理
  $('#btnOrganize').addEventListener('click', openOrganize);

  // 选择模式
  $('#btnSelect').addEventListener('click', () => {
    if (state.selMode) exitSelMode(); else enterSelMode();
  });
  $('#selAll').addEventListener('click', () => {
    const ids = viewPhotos().map(m => m.id);
    const allSel = ids.length > 0 && ids.every(id => state.selected.has(id));
    if (allSel) ids.forEach(id => state.selected.delete(id));
    else ids.forEach(id => state.selected.add(id));
    renderGrid();
    renderSelBar();
  });

  // 搜索
  $('#searchInput').addEventListener('input', e => {
    state.view.q = e.target.value;
    $('#searchClear').style.display = e.target.value ? 'flex' : 'none';
    renderGrid();
    renderTopbar();
  });
  $('#searchClear').addEventListener('click', () => {
    $('#searchInput').value = '';
    state.view.q = '';
    $('#searchClear').style.display = 'none';
    renderGrid();
    renderTopbar();
  });

  // 照片卡片
  $('#grid').addEventListener('click', e => {
    const card = e.target.closest('.photo-card');
    if (!card) return;
    const id = card.dataset.id;
    const rangeSel = (startId, endId) => {
      const list = viewPhotos().map(m => m.id);
      const a = list.indexOf(startId), b = list.indexOf(endId);
      if (a >= 0 && b >= 0){
        const lo = Math.min(a,b), hi = Math.max(a,b);
        for (let i = lo; i <= hi; i++) state.selected.add(list[i]);
      }
    };
    if (e.target.closest('.pc-check')){
      if (e.shiftKey && state.lastSelId){ rangeSel(state.lastSelId, id); }
      else{ state.lastSelId = id; selectPhoto(id, state.selected.size > 0 || state.selMode); }
      return;
    }
    if (state.selMode){
      if (e.shiftKey && state.lastSelId) rangeSel(state.lastSelId, id);
      else{ state.lastSelId = id; selectPhoto(id, true); }
      return;
    }
    openLightbox(id);
  });
  // 拖拽照片
  $('#grid').addEventListener('dragstart', e => {
    const card = e.target.closest('.photo-card');
    if (!card) return;
    dragPhotoId = card.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    card.classList.add('dragging');
  });
  $('#grid').addEventListener('dragend', e => {
    const card = e.target.closest('.photo-card');
    if (card) card.classList.remove('dragging');
    dragPhotoId = null;
  });

  // 选择工具栏
  $('#selMove').addEventListener('click', () => openMoveDialog([...state.selected]));
  $('#selDownload').addEventListener('click', () => {
    [...state.selected].forEach(downloadPhoto);
    toast('开始下载 ' + state.selected.size + ' 张照片');
  });
  $('#selDelete').addEventListener('click', () => confirmDelete([...state.selected]));
  $('#selClear').addEventListener('click', () => { if (state.selMode) exitSelMode(); else { state.selected.clear(); renderAll(); } });

  // 灯箱
  $('#lbClose').addEventListener('click', closeLightbox);
  $('#lbPrev').addEventListener('click', () => lbNav(-1));
  $('#lbNext').addEventListener('click', () => lbNav(1));
  $('#lightbox').addEventListener('click', e => { if (e.target === $('#lightbox')) closeLightbox(); });
  $('#lbMove').addEventListener('click', () => { if (state.lb) openMoveDialog([state.lb]); });
  $('#lbDownload').addEventListener('click', () => { if (state.lb) downloadPhoto(state.lb); });
  $('#lbDelete').addEventListener('click', () => { if (state.lb) confirmDelete([state.lb], closeLightbox); });

  // 智能相簿「重新分析」
  document.addEventListener('click', e => {
    const r = e.target.closest('#btnReanalyze');
    if (r) reanalyzeSmart();
  });

  // 键盘
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      if ($('#modalRoot').classList.contains('show')) closeModal();
      else closeLightbox();
    }
    if ($('#lightbox').classList.contains('show') && e.target.tagName !== 'INPUT'){
      if (e.key === 'ArrowLeft') lbNav(-1);
      if (e.key === 'ArrowRight') lbNav(1);
    }
  });

  // 移动端侧栏
  $('#hamburger').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
  $('#sideClose').addEventListener('click', closeSidebar);
  $('#main').addEventListener('click', e => {
    if ($('#sidebar').classList.contains('open') && !e.target.closest('#hamburger')) closeSidebar();
  });

  // 拖拽上传
  window.addEventListener('dragenter', e => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')){
      dragDepth++;
      $('#dropOverlay').classList.add('show');
    }
  });
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) $('#dropOverlay').classList.remove('show');
  });
  window.addEventListener('dragover', e => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault();
  });
  window.addEventListener('drop', e => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')){
      e.preventDefault();
      dragDepth = 0;
      $('#dropOverlay').classList.remove('show');
      handleFiles(e.dataTransfer.files);
    }
  });
}

/* =====================================================================
   初始化
===================================================================== */
(async function init(){
  try{
    _db = await openDB();
  }catch(e){
    toast('浏览器不支持 IndexedDB，无法保存照片', 'err');
    return;
  }
  state.meta = await dbAll(S_META);
  state.folders = await dbAll(S_FOLDERS);
  const thumbs = await dbAllKind('thumb');
  for (const t of thumbs) state.thumbs.set(t.photoId, URL.createObjectURL(t.blob));
  bindEvents();
  renderAll();
})();
</script>
</body>
